services:
  db:
    image: postgres:16-alpine
    container_name: hugabuga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hugabuga
      POSTGRES_USER: hugabuga
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - hugabuga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugabuga -d hugabuga"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hugabuga-data: