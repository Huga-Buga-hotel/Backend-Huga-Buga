services:
  db:
    image: postgres:16-alpine
    container_name: hugabuga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hugabuga
      POSTGRES_USER: ${DB_USER:-hugabuga}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env (veja .env.example)}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"   # 5433 no host para não colidir com um PostgreSQL local
    volumes:
      - hugabuga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hugabuga"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    image: hugabuga-api
    container_name: hugabuga-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o banco responde pelo nome do serviço ("db"), na porta interna 5432
      DB_URL: jdbc:postgresql://db:5432/hugabuga
      DB_USER: ${DB_USER:-hugabuga}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SEGREDO: ${JWT_SEGREDO:?Defina JWT_SEGREDO no .env (mínimo 32 caracteres)}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:3000,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      UPLOADS_DIR: /app/uploads
      # Chatbot rodando no host (uvicorn app:app --port 8000)
      CHATBOT_URL: ${CHATBOT_URL:-http://host.docker.internal:8000}
      CHATBOT_TOKEN: ${CHATBOT_TOKEN:-}
      TZ: America/Sao_Paulo
    extra_hosts:
      - "host.docker.internal:host-gateway"   # no Linux o Docker não cria esse nome sozinho
    ports:
      - "8080:8080"
    volumes:
      - hugabuga-uploads:/app/uploads   # fotos das avaliações sobrevivem a um rebuild
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  hugabuga-data:
  hugabuga-uploads:
